name: Release to NuGet

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (e.g. 1.0.1)'
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore
        run: dotnet restore

      - name: Pack
        run: >
          dotnet pack -c Release
          -p:BuildClientAssets=true
          -p:Version=${{ steps.version.outputs.value }}
          -o ./artifacts

      - name: Verify backoffice assets are packaged
        shell: bash
        run: |
          package_file=$(find ./artifacts -maxdepth 1 -type f -name 'Umbraco.Community.NetlifyDashboard.*.nupkg' -print -quit)

          if [ -z "$package_file" ]; then
            echo "No NuGet package was created."
            exit 1
          fi

          package_contents=$(unzip -Z1 "$package_file")
          grep -Fx 'staticwebassets/App_Plugins/NetlifyDashboard/umbraco-package.json' <<< "$package_contents"
          grep -Fx 'staticwebassets/App_Plugins/NetlifyDashboard/netlify-dashboard.js' <<< "$package_contents"

      - name: Smoke test package in a clean Umbraco site
        shell: bash
        run: |
          smoke_dir="$RUNNER_TEMP/netlify-dashboard-smoke"
          package_version="${{ steps.version.outputs.value }}"

          dotnet new install Umbraco.Templates::17.4.2
          dotnet new umbraco \
            --output "$smoke_dir" \
            --name NetlifyDashboardSmoke \
            --release Latest \
            --package-management PerProject \
            --development-database-type SQLite \
            --no-restore
          dotnet add "$smoke_dir/NetlifyDashboardSmoke.csproj" \
            package Umbraco.Community.NetlifyDashboard \
            --version "$package_version" \
            --no-restore
          dotnet restore "$smoke_dir/NetlifyDashboardSmoke.csproj" \
            --source "$GITHUB_WORKSPACE/artifacts" \
            --source https://api.nuget.org/v3/index.json
          dotnet build "$smoke_dir/NetlifyDashboardSmoke.csproj" --no-restore

          assets_manifest=$(find "$smoke_dir/obj" -type f -name 'staticwebassets.development.json' -print -quit)
          test -n "$assets_manifest"
          grep -F 'App_Plugins/NetlifyDashboard/umbraco-package.json' "$assets_manifest"

      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        run: >
          dotnet nuget push "./artifacts/*.nupkg"
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ./artifacts/*
